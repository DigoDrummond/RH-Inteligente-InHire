# ============================================================================
# Docker Compose - InHire Sync Stack Completo
# ============================================================================
# Serviços:
#   - postgres: Banco de dados PostgreSQL
#   - inhire-sync: Aplicação principal
#   - scheduler: Agendador de sincronizações
#   - health-check: Serviço de health checks
#   - metrics: Servidor de métricas
#   - prometheus: Coleta de métricas
#   - grafana: Dashboards visuais
#   - alertmanager: Gerenciador de alertas
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: inhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inhire}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inhire-network

  # ==========================================================================
  # InHire Sync - Aplicação Principal
  # ==========================================================================
  inhire-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inhire-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inhire}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # InHire API
      INHIRE_EMAIL: ${INHIRE_EMAIL}
      INHIRE_PASSWORD: ${INHIRE_PASSWORD}
      INHIRE_TENANT: ${INHIRE_TENANT}

      # Sync Config
      SYNC_ENABLED: "true"
      SYNC_BATCH_SIZE: 50

      # Timeline Optimization
      TIMELINE_MAX_WORKERS: 10

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: ["python", "run_sync.py", "--incremental"]
    networks:
      - inhire-network

  # ==========================================================================
  # Scheduler - Agendador Automático
  # ==========================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inhire-scheduler
    restart: unless-stopped
    depends_on:
      - postgres
      - inhire-sync
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inhire}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      INHIRE_EMAIL: ${INHIRE_EMAIL}
      INHIRE_PASSWORD: ${INHIRE_PASSWORD}
      INHIRE_TENANT: ${INHIRE_TENANT}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_FULL_SYNC_HOUR: 2
    volumes:
      - ./logs:/app/logs
    command: ["python", "scheduler.py"]
    networks:
      - inhire-network

  # ==========================================================================
  # Health Check Service
  # ==========================================================================
  health-check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inhire-health
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inhire}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      INHIRE_EMAIL: ${INHIRE_EMAIL}
      INHIRE_PASSWORD: ${INHIRE_PASSWORD}
      INHIRE_TENANT: ${INHIRE_TENANT}
    ports:
      - "8080:8080"
    command: ["python", "health_check.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - inhire-network

  # ==========================================================================
  # Metrics Server
  # ==========================================================================
  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inhire-metrics
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inhire}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      METRICS_ENABLED: "true"
      METRICS_PORT: 8000
    ports:
      - "8000:8000"
    command: ["python", "metrics_server.py"]
    networks:
      - inhire-network

  # ==========================================================================
  # Prometheus - Coleta de Métricas
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: inhire-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - inhire-network

  # ==========================================================================
  # Grafana - Dashboards Visuais
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: inhire-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - inhire-network

  # ==========================================================================
  # Alertmanager - Gerenciamento de Alertas
  # ==========================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: inhire-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - inhire-network

# ============================================================================
# Networks
# ============================================================================
networks:
  inhire-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

# ============================================================================
# USAGE:
# ============================================================================
# 1. Criar arquivo .env com variáveis necessárias
# 2. Iniciar stack completo:
#    docker-compose up -d
#
# 3. Verificar status:
#    docker-compose ps
#
# 4. Ver logs:
#    docker-compose logs -f inhire-sync
#
# 5. Parar stack:
#    docker-compose down
#
# 6. Parar e remover volumes:
#    docker-compose down -v
#
# ACESSAR SERVIÇOS:
# - Health Check: http://localhost:8080/health
# - Metrics: http://localhost:8000/metrics
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3000 (admin/admin)
# - Alertmanager: http://localhost:9093
# - PostgreSQL: localhost:5432
# ============================================================================
