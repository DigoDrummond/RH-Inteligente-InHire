<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Posições - InHire</title>
  <?!= include('Styles'); ?>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <h1>Framework</h1>
      <p>InHire Analytics</p>
    </div>

    <div class="sidebar-menu">
      <a href="?page=dashboard" class="menu-item">
        <span class="menu-item-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="?page=busca" class="menu-item active">
        <span class="menu-item-icon">🔍</span>
        <span>Buscar Posições</span>
      </a>
      <a href="?page=relatorios" class="menu-item">
        <span class="menu-item-icon">📈</span>
        <span>Relatórios</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <p>Sistema InHire v1.0</p>
      <p>© 2026 Framework Data</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <div class="header">
        <div>
          <h2>🔍 Buscar Posições</h2>
          <p class="subtitle">Filtros avançados para consulta</p>
        </div>
      </div>

      <!-- Filtros -->
      <div class="chart-card" style="margin-bottom: 25px;">
        <h3>🎯 Filtros de Busca</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;">
          <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #666;">Cliente</label>
            <input type="text" id="filtroCliente" placeholder="Digite o nome do cliente"
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
          </div>

          <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #666;">Recrutadora</label>
            <input type="text" id="filtroRecrutadora" placeholder="Digite o nome da recrutadora"
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
          </div>

          <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #666;">Status</label>
            <select id="filtroStatus" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
              <option value="">Todos</option>
              <option value="open">Aberta</option>
              <option value="closed">Fechada</option>
              <option value="canceled">Cancelada</option>
            </select>
          </div>

          <div>
            <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #666;">Torre</label>
            <input type="text" id="filtroTorre" placeholder="Torre"
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
          </div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
          <button class="btn btn-primary" onclick="buscar()">🔍 Buscar</button>
          <button class="btn" onclick="limparFiltros()"
                  style="background: #e0e0e0; color: #666;">🔄 Limpar</button>
        </div>
      </div>

      <!-- Resultados -->
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <div>Buscando...</div>
      </div>

      <div id="resultados" class="chart-card" style="display: none;">
        <h3>📋 Resultados</h3>
        <div id="totalResultados" style="margin: 15px 0; color: #666;"></div>
        <div style="overflow-x: auto; margin-top: 20px;">
          <table class="data-table" id="tabelaResultados">
            <thead>
              <tr>
                <th>ID</th>
                <th>Cargo</th>
                <th>Status</th>
                <th>Cliente</th>
                <th>Recrutadora</th>
                <th>Torre</th>
                <th>Data Pub.</th>
                <th>SLA Geral</th>
              </tr>
            </thead>
            <tbody id="tabelaResultadosBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function buscar() {
      const filtros = {
        cliente: document.getElementById('filtroCliente').value,
        recrutadora: document.getElementById('filtroRecrutadora').value,
        status: document.getElementById('filtroStatus').value,
        torre: document.getElementById('filtroTorre').value
      };

      document.getElementById('loading').style.display = 'flex';
      document.getElementById('resultados').style.display = 'none';

      google.script.run
        .withSuccessHandler(mostrarResultados)
        .withFailureHandler(mostrarErro)
        .buscarPosicoes(filtros);
    }

    function mostrarResultados(dados) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('resultados').style.display = 'block';

      document.getElementById('totalResultados').innerHTML =
        `<strong>${dados.total}</strong> resultado(s) encontrado(s) (mostrando até 100)`;

      if (dados.rows.length === 0) {
        document.getElementById('tabelaResultadosBody').innerHTML =
          '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #999;">Nenhum resultado encontrado</td></tr>';
        return;
      }

      // Preencher tabela
      const tbody = document.getElementById('tabelaResultadosBody');
      tbody.innerHTML = dados.rows.map(row => `
        <tr>
          <td>${row[0]}</td>
          <td><strong>${row[3]}</strong></td>
          <td><span class="badge" style="background: ${getStatusColor(row[4])}; font-size: 11px;">${getStatusLabel(row[4])}</span></td>
          <td>${row[11] || '-'}</td>
          <td>${row[10] || '-'}</td>
          <td>${row[12] || '-'}</td>
          <td>${formatDate(row[6])}</td>
          <td>${row[16] || '-'} dias</td>
        </tr>
      `).join('');
    }

    function limparFiltros() {
      document.getElementById('filtroCliente').value = '';
      document.getElementById('filtroRecrutadora').value = '';
      document.getElementById('filtroStatus').value = '';
      document.getElementById('filtroTorre').value = '';
      document.getElementById('resultados').style.display = 'none';
    }

    function getStatusLabel(status) {
      const labels = {
        'open': 'Aberta',
        'closed': 'Fechada',
        'canceled': 'Cancelada',
        'archived': 'Arquivada'
      };
      return labels[status] || status;
    }

    function getStatusColor(status) {
      const colors = {
        'open': '#2196F3',
        'closed': '#4CAF50',
        'canceled': '#F44336',
        'archived': '#9E9E9E'
      };
      return colors[status] || '#999';
    }

    function formatDate(date) {
      if (!date) return '-';
      const d = new Date(date);
      return d.toLocaleDateString('pt-BR');
    }

    function mostrarErro(error) {
      document.getElementById('loading').innerHTML = `
        <div style="color: #ff6b6b;">
          <h3>❌ Erro ao buscar dados</h3>
          <p>${error.message}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
