# Prometheus Configuration - InHire Sync

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'inhire-sync'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

# Load rules
rule_files:
  - 'alerts.yaml'

# Scrape configurations
scrape_configs:
  # InHire Sync Metrics Server
  - job_name: 'inhire-metrics'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'inhire-sync'
          component: 'metrics'

  # Health Check Service
  - job_name: 'inhire-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'inhire-sync'
          component: 'health'

  # PostgreSQL Exporter (opcional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
        labels:
          service: 'postgresql'
          database: 'inhire'

  # Node Exporter (métricas do sistema)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'system'

# Remote write (opcional - para armazenamento de longo prazo)
# remote_write:
#   - url: "http://prometheus-remote-storage:9009/api/v1/write"
