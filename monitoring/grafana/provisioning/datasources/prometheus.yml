# ============================================================================
# Grafana Datasource Provisioning - Prometheus
# ============================================================================
# Configura automaticamente o Prometheus como fonte de dados no Grafana
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "30s"
      queryTimeout: "60s"
      httpMethod: POST
    version: 1
