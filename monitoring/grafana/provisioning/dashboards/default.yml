# ============================================================================
# Grafana Dashboard Provisioning
# ============================================================================
# Configura automaticamente os dashboards do Grafana a partir de arquivos
# ============================================================================

apiVersion: 1

providers:
  - name: 'InHire Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
