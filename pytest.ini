[pytest]
# Configuração do pytest para o projeto

# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Opções padrão
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --cov=services
    --cov=models
    --cov=utils
    --cov=health_check
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
    --durations=10
    --color=yes
    --log-cli-level=INFO

# Markers personalizados
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, API)
    slow: Slow running tests (> 1 second)
    requires_db: Requires test database
    requires_api: Requires InHire API available
    smoke: Smoke tests (quick validation)
    regression: Regression tests

# Configurações de cobertura
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*
    setup.py
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
